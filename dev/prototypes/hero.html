<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Prototipos de portada | SGV Importaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&family=Unbounded:wght@500..700&display=swap">
<style>
/* SOLO DESARROLLO: superficie aislada de prototipos. Nada de producción importa de aquí. */
/* --- estilos reales de index.html (contexto fiel) --- */

/* Concepto: tablero de control de una ruta comercial.
   Un globo de puntos centrado en Sudamérica (eco del globo del logo) con la ruta Santiago a Montevideo,
   paneles de vidrio y datos reales como coordenadas. Azul y rojo de Chile, oro de Uruguay.
   Una sola secuencia de movimiento al cargar; el resto responde a lo que hace la persona. */
:root{
  --cl-azul:#2F63D8;
  --cl-rojo:#D52B1E;
  --oro:#FCD116;

  --void:#050A18;
  --abismo:#030612;
  --panel:rgba(255,255,255,.05);
  --vidrio:rgba(10,19,48,.66);
  --anillo:rgba(143,176,255,.22);
  --ink:#EAF0FF;
  --texto:#C9D5EE;
  --muted:#9FB0D0;
  --azul:#8FB0FF;
  --rojo:#FF6050;
  --on-oro:#0B1B3F;
  --err:#FF8A80;
  --campo:rgba(3,6,18,.65);
  --estrella-vacia:#6A7DA6;

  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);

  --display:"Unbounded","Sora",system-ui,sans-serif;
  --ui:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--void);scroll-behavior:smooth;scroll-padding-top:6rem;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--ink);font:400 1rem/1.65 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:var(--azul)}
h1,h2,h3,h4{margin:0;color:var(--ink);text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:600;overflow-wrap:anywhere}
p{margin:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
:focus-visible{outline:2px solid var(--azul);outline-offset:3px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:72rem;margin-inline:auto;padding-inline:max(clamp(16px,4vw,40px),env(safe-area-inset-left,0px)) max(clamp(16px,4vw,40px),env(safe-area-inset-right,0px))}
.skip{position:absolute;left:1rem;top:-4rem;z-index:20;background:var(--oro);color:var(--on-oro);padding:.7rem 1rem;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:1rem}
a,button,label,select{touch-action:manipulation}
.btn,.nav a,.pie-nav a,.estrellas label,.skip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* Barra superior: vidrio, con la franja azul, rojo y oro */
.top{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:rgba(5,10,24,.72);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 var(--anillo)}
.top::before,.pie::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--cl-azul) 0 45%,var(--cl-rojo) 45% 60%,var(--oro) 60% 100%)}
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;padding-block:.5rem}
.marca{display:inline-flex;align-items:center;text-decoration:none}
.logo{display:block;height:56px;width:auto}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:0 clamp(.25rem,1.5vw,.75rem)}
.nav a{display:inline-flex;align-items:center;min-height:2.75rem;padding-inline:.7rem;color:var(--ink);font:500 .9375rem/1 var(--ui);text-decoration:underline 2px transparent;text-underline-offset:.5em;transition:text-decoration-color .15s}
.nav a[aria-current]{text-decoration-color:var(--oro)}
.nav a.nav-cta{background:var(--oro);color:var(--on-oro);padding-inline:1.1rem;border-radius:10px;font-weight:600;text-decoration:none;transition:transform 160ms var(--ease-out),filter .15s ease}
.nav a.nav-cta:active{transform:scale(.97)}
@media (max-width:560px){
  .logo{height:44px}
  .nav a{padding-inline:.45rem;font-size:.875rem}
  .nav a.nav-cta{padding-inline:.8rem}
}
@media (max-height:520px){.top{position:static}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.8rem 1.4rem;border:0;border-radius:10px;font:600 1rem/1.2 var(--ui);text-align:center;text-decoration:none;cursor:pointer;transition:transform 160ms var(--ease-out),filter .15s ease,background-color .15s ease}
.btn:active{transform:scale(.97)}
.btn-oro{background:var(--oro);color:var(--on-oro);box-shadow:0 0 0 1px rgba(252,209,22,.55),0 10px 30px -12px rgba(252,209,22,.6)}
.btn-claro{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(143,176,255,.4)}
@media (hover:hover) and (pointer:fine){
  .btn-oro:hover{filter:brightness(1.07)}
  .btn-claro:hover{background:rgba(255,255,255,.11)}
  .nav a:hover{text-decoration-color:var(--azul)}
  .nav a.nav-cta:hover{filter:brightness(1.07)}
  .pie-nav a:hover{text-decoration-color:var(--azul)}
  .estrellas label:hover,.estrellas label:hover ~ label{color:var(--oro)}
}

/* Portada */
.hero{position:relative;isolation:isolate;overflow:clip;background:radial-gradient(55rem 38rem at 76% 42%,rgba(47,99,216,.26),transparent 62%),var(--void)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(143,176,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(143,176,255,.07) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 70% 85% at 72% 45%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 70% 85% at 72% 45%,#000 25%,transparent 78%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(2rem,5vw,4rem);align-items:center;padding-block:clamp(2.5rem,6vw,5rem) clamp(5.5rem,9vw,7.5rem)}
.hero h1{font-size:min(clamp(1.7rem,1rem + 3.3vw,3.2rem),11vw);line-height:1.12;letter-spacing:-.015em;max-width:17ch}
.intro{margin-top:1.4rem;font-size:clamp(1rem,.95rem + .35vw,1.15rem);line-height:1.7;color:var(--texto);max-width:46ch}
.acciones{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.globo-bloque{max-width:32rem;margin-inline:auto;width:100%}}

/* Globo y ruta */
.globo-bloque{display:grid;gap:1rem;min-width:0}
.globo{position:relative;width:min(100%,540px);aspect-ratio:1;margin-inline:auto}
.globo > img,.globo > svg{position:absolute;inset:0;width:100%;height:100%}
.ruta{overflow:visible}
.arco{filter:drop-shadow(0 0 5px rgba(255,96,80,.55))}
.nodo{transform-box:fill-box;transform-origin:center}
.nodo-cl{color:var(--rojo);filter:drop-shadow(0 0 4px currentColor)}
.nodo-uy{color:var(--oro);filter:drop-shadow(0 0 4px currentColor)}
.ping{opacity:0;transform-box:fill-box;transform-origin:center}
.coords{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.75rem}
.coords div{display:grid;gap:.1rem;padding:.7rem .95rem;background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--anillo)}
.coords dt{display:flex;align-items:center;gap:.55rem;font-size:.9375rem;font-weight:600}
.coords dd{margin:0;padding-left:1.15rem;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.punto{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.punto-cl{--c:var(--rojo)}
.punto-uy{--c:var(--oro)}

/* Datos de la empresa: panel de vidrio que cruza el borde de la portada */
.datos{position:relative;z-index:2;margin-top:-3.5rem}
.datos dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:1rem 1.5rem;padding:1.25rem 1.5rem;background:var(--vidrio);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 0 0 1px var(--anillo),0 30px 70px -30px rgba(0,0,0,.9)}
.datos dt{font-size:.875rem;color:var(--muted)}
.datos dd{margin:.15rem 0 0;font-weight:600;overflow-wrap:anywhere}

/* Secciones */
.seccion{padding-block:clamp(3.5rem,8vw,6rem)}
.seccion + .seccion{border-top:1px solid rgba(143,176,255,.12)}
.seccion-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(2rem,5vw,4.5rem);align-items:start}
@media (max-width:860px){.seccion-grid{grid-template-columns:1fr}}
.seccion-head{display:grid;grid-template-columns:minmax(0,1fr);gap:.9rem;align-content:start;min-width:0}
.seccion h2{font-size:min(clamp(1.45rem,1rem + 1.7vw,2.1rem),9vw);line-height:1.15;letter-spacing:-.01em}
.seccion-head p{color:var(--muted);max-width:40ch}

/* Historia */
.relato{display:grid;gap:1.25rem;max-width:62ch;min-width:0}
.relato p{font-size:1.0625rem;line-height:1.75;color:var(--texto)}
.relato .lead{font-size:clamp(1.2rem,1.1rem + .5vw,1.4rem);line-height:1.55;color:var(--ink)}
.sub{margin-top:1.75rem;font:600 1.0625rem/1.3 var(--ui)}
.relato .sub + *{margin-top:-.25rem}

.monedas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:1rem}
.monedas li{position:relative;overflow:hidden;min-width:0;padding:1.25rem 1rem 1rem;background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--anillo)}
.monedas li::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--barra)}
.moneda-cl{--barra:linear-gradient(90deg,var(--cl-azul) 0 62%,var(--cl-rojo) 62% 100%)}
.moneda-uy{--barra:var(--oro)}
.moneda-usd{--barra:var(--ink)}
.monedas b{display:block;font:700 1.45rem/1 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}
.monedas span{display:block;margin-top:.6rem;font-size:.9375rem;line-height:1.45;color:var(--muted)}

.pasos{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem;counter-reset:paso}
.pasos li{counter-increment:paso;position:relative;padding-top:2.8rem;min-width:0}
.pasos li:nth-child(1){--nodo:var(--cl-azul);--sig:var(--cl-rojo);--on-nodo:#fff}
.pasos li:nth-child(2){--nodo:var(--cl-rojo);--sig:var(--oro);--on-nodo:#fff}
.pasos li:nth-child(3){--nodo:var(--oro);--sig:transparent;--on-nodo:var(--on-oro)}
.pasos li::before{content:"";position:absolute;top:.95rem;left:0;right:-1.5rem;height:2px;background:linear-gradient(90deg,var(--nodo),var(--sig))}
.pasos li:last-child::before{right:0}
.pasos li::after{content:counter(paso);position:absolute;top:0;left:0;display:grid;place-items:center;width:1.95rem;height:1.95rem;border-radius:50%;background:var(--nodo);color:var(--on-nodo);font:700 .875rem/1 var(--ui);box-shadow:0 0 0 4px color-mix(in srgb,var(--nodo) 25%,transparent),0 0 18px color-mix(in srgb,var(--nodo) 55%,transparent)}
.pasos h4{margin:0;font:600 1.0625rem/1.3 var(--ui);overflow-wrap:anywhere}
.pasos p{margin-top:.4rem;font-size:.96875rem;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:640px){
  .pasos{grid-template-columns:1fr;gap:1.6rem}
  .pasos li{padding:0 0 0 3rem}
  .pasos li::before{top:2.2rem;bottom:-1.6rem;left:.95rem;right:auto;width:2px;height:auto;background:linear-gradient(180deg,var(--nodo),var(--sig))}
  .pasos li:last-child::before{display:none}
}

/* Reseñas */
.vacio{border:1.5px dashed rgba(143,176,255,.32);border-radius:14px;padding:clamp(1.4rem,4vw,2rem);display:grid;gap:.55rem;margin-top:.6rem}
.vacio .muestra{font-size:1.35rem;letter-spacing:.18em;color:var(--oro);line-height:1;overflow-wrap:anywhere}
.vacio h3{font:600 1.1rem/1.3 var(--ui)}
.vacio p{color:var(--muted);max-width:42ch}

/* Formularios */
.form{position:relative;overflow:hidden;display:grid;gap:1.15rem;min-width:0;padding:calc(clamp(1.25rem,3.5vw,2rem) + 3px) clamp(1.25rem,3.5vw,2rem) clamp(1.25rem,3.5vw,2rem);background:var(--vidrio);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 0 0 1px var(--anillo),0 30px 70px -40px rgba(0,0,0,.9)}
.form::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--barra-form)}
.form-contacto{--barra-form:linear-gradient(90deg,var(--cl-azul) 0 60%,var(--cl-rojo) 60% 100%)}
.form-resena{--barra-form:var(--oro)}
.form h3{font:600 1.2rem/1.3 var(--ui)}
.campo{display:grid;gap:.4rem;min-width:0;align-content:start}
.campo > label,.campo legend{font:600 .875rem/1.3 var(--ui);color:var(--ink);padding:0}
.opc{font-weight:400;color:var(--muted)}
.ayuda{font-size:.875rem;color:var(--muted)}
.campo input:not([type="radio"]),.campo select,.campo textarea{width:100%;min-height:3rem;font:400 1rem/1.4 var(--ui);color:var(--ink);background:var(--campo);border:0;border-radius:10px;padding:.75rem .95rem;box-shadow:inset 0 0 0 1px rgba(143,176,255,.5);transition:box-shadow .15s ease}
.campo textarea{min-height:8rem;resize:vertical;line-height:1.55}
.campo input:not([type="radio"]):focus-visible,.campo select:focus-visible,.campo textarea:focus-visible{outline:2px solid var(--azul);outline-offset:0;box-shadow:inset 0 0 0 1px var(--azul)}
.campo [aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--err)}
.error{font-size:.875rem;color:var(--err);transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out)}
.error:empty{display:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fila{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media (max-width:560px){.fila{grid-template-columns:1fr}}
.califica{display:flex;align-items:center;flex-wrap:wrap;gap:.25rem 1rem}
.estrellas{display:inline-flex;flex-wrap:wrap;flex-direction:row-reverse;justify-content:flex-end}
.estrellas input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.estrellas label{display:grid;place-items:center;min-width:44px;min-height:44px;font-size:30px;line-height:1;color:var(--estrella-vacia);cursor:pointer;transition:color 120ms ease,transform 160ms var(--ease-out)}
.estrellas label:active{transform:scale(.9)}
.estrellas input:checked ~ label{color:var(--oro)}
.estrellas input:focus-visible + label{outline:2px solid var(--azul);outline-offset:1px;border-radius:8px}
.valor{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pie-form{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
.contador{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.estado{padding:.8rem .95rem;border-radius:0 10px 10px 0;border-left:3px solid var(--azul);background:rgba(143,176,255,.1);font-size:.9375rem;line-height:1.55;overflow-wrap:anywhere;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
@starting-style{.error,.estado{opacity:0;transform:translateY(4px)}}

/* Pie */
.pie{position:relative;background:var(--abismo);color:var(--muted)}
.pie-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 2rem;padding-block:2rem 2.5rem;font-size:.875rem}
.logo-pie{height:64px}
.pie-nav{display:flex;flex-wrap:wrap;gap:0 1rem}
.pie-nav a{display:inline-flex;align-items:center;min-height:2.75rem;padding-inline:.25rem;color:var(--ink);font-weight:500;text-decoration:underline 1px rgba(143,176,255,.4);text-underline-offset:.4em;transition:text-decoration-color .15s}
.pie-legal{display:grid;gap:.15rem;text-align:right}
@media (max-width:640px){.pie-legal{text-align:left}}

/* Movimiento: una secuencia al cargar (explicar la ruta); el resto responde a la persona */
@keyframes entrar{from{opacity:0}}
@keyframes revelar{from{clip-path:inset(0 100% 0 0)}}
@keyframes aparecer-nodo{from{opacity:0;transform:scale(.9)}}
@keyframes pulso{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.globo > img{animation:entrar .5s ease backwards}
.arco{animation:revelar .9s .35s var(--ease-in-out) backwards}
.nodo-cl{animation:aparecer-nodo .25s .3s var(--ease-out) backwards}
.nodo-uy{animation:aparecer-nodo .25s 1.2s var(--ease-out) backwards}
.ping{animation:pulso 1.4s var(--ease-out) 2 backwards}
.nodo-cl .ping{animation-delay:.55s}
.nodo-uy .ping{animation-delay:1.45s}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .arco,.nodo-cl,.nodo-uy{animation:entrar .3s ease backwards}
  .ping{display:none}
  .btn:active,.nav a.nav-cta:active,.estrellas label:active{transform:none}
  @starting-style{.error,.estado{transform:none}}
}


/* ===== Variante 2: Manifiesto (la tipografía manda) ===== */
.v2-grid{display:grid;gap:clamp(1.5rem,3vw,2.5rem);padding-block:clamp(2.5rem,6vw,5rem) clamp(5.5rem,9vw,7.5rem)}
.hero .v2-h1{font-size:min(clamp(2rem,5.7vw,4.6rem),10vw);line-height:1.04;letter-spacing:-.02em;max-width:none}
.v2-l{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.v2-l > span{display:block;animation:subir .6s var(--ease-out) backwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes subir{from{transform:translateY(105%)}}
.v2-riel{display:grid;grid-template-columns:auto minmax(2rem,1fr) auto;align-items:center;gap:1rem 1.25rem}
.v2-ciudad{display:grid;gap:.15rem;font:600 1.05rem/1.25 var(--ui);min-width:0}
.v2-ciudad small{font-weight:400;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.v2-ciudad-uy{text-align:right}
.v2-linea{position:relative;height:2px;background:linear-gradient(90deg,var(--cl-azul),var(--cl-rojo) 55%,var(--oro));animation:revelar-v2 .9s .45s var(--ease-in-out) backwards}
@keyframes revelar-v2{from{clip-path:inset(-8px 100% -8px -8px)}}
.v2-linea::before,.v2-linea::after{content:"";position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px currentColor,0 0 14px currentColor}
.v2-linea::before{left:0;color:var(--rojo)}
.v2-linea::after{right:0;color:var(--oro)}
.v2-pie{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.5rem 3rem}
.v2-pie .intro{margin:0}
.v2-pie .acciones{margin:0}

/* ===== Variante 3: Mercado (eliges y la página responde) ===== */
.v3-grid{display:grid;justify-items:center;text-align:center;gap:1rem;padding-block:clamp(2rem,4vw,3rem) clamp(5rem,8vw,6.5rem)}
.hero .v3-h1{font-size:min(clamp(1.5rem,1rem + 2vw,2.2rem),9vw);line-height:1.14;letter-spacing:-.015em;max-width:none}
.v3-intro{margin:0;max-width:72ch;font-size:1rem}
.v3-mercado{border:0;margin:.25rem 0 0;padding:0;min-width:0;width:100%}
.v3-pregunta{width:100%;padding:0;margin-bottom:.5rem;font:600 .9375rem/1.3 var(--ui);color:var(--muted);text-align:center}
.v3-consola{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"c g u";align-items:center;gap:clamp(.75rem,3vw,2rem);max-width:56rem;margin-inline:auto}
.v3-globo{grid-area:g;position:relative;width:min(56vw,230px);aspect-ratio:1}
.v3-globo > img,.v3-globo > svg{position:absolute;inset:0;width:100%;height:100%}
.v3-chip{position:relative;display:block;cursor:pointer;min-height:44px}
.v3-chip-cl{grid-area:c}
.v3-chip-uy{grid-area:u}
.v3-chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.v3-chip > span{display:grid;gap:.1rem;padding:.8rem 1.05rem;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--anillo);text-align:left;transition:box-shadow .2s ease,background-color .2s ease,transform 160ms var(--ease-out)}
.v3-chip-uy > span{text-align:right}
.v3-chip b{font:700 1.1rem/1.2 var(--display)}
.v3-chip small{font-size:.875rem;color:var(--muted)}
.v3-chip-cl{--c:var(--rojo)}
.v3-chip-uy{--c:var(--oro)}
.v3-chip input:checked + span{background:rgba(255,255,255,.08);box-shadow:0 0 0 1.5px var(--c),0 0 28px -6px var(--c)}
.v3-chip input:focus-visible + span{outline:2px solid var(--azul);outline-offset:3px}
.v3-chip:active > span{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.v3-chip:hover > span{background:rgba(255,255,255,.1)}}
.v3-consola .nodo{transition:opacity .2s ease,transform 200ms var(--ease-out)}
.v3-consola[data-market="cl"] .nodo-uy,.v3-consola[data-market="uy"] .nodo-cl{opacity:.35}
.v3-consola[data-market="cl"] .nodo-cl,.v3-consola[data-market="uy"] .nodo-uy{transform:scale(1.3)}
.ping.pulsa{animation:pulso 1s var(--ease-out) 1}
.v3-detalle{display:grid;justify-items:center;gap:.75rem;min-height:7.5rem;width:100%}
.v3-detalle.entra{animation:entrar-arriba .2s var(--ease-out)}
@keyframes entrar-arriba{from{opacity:0;transform:translateY(4px)}}
.v3-texto{max-width:44ch;color:var(--texto)}
.v3-monedas{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;list-style:none;margin:0;padding:0}
.v3-monedas li{padding:.2rem .75rem;border-radius:999px;font:600 .875rem/1.6 var(--ui);box-shadow:inset 0 0 0 1px var(--anillo)}
@media (max-width:640px){
  .v3-consola{grid-template-columns:1fr 1fr;grid-template-areas:"g g" "c u"}
  .v3-globo{justify-self:center;width:min(56vw,210px)}
}
@media (max-width:560px){
  .v2-riel{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "l l"}
  .v2-ciudad:first-child{grid-area:a}
  .v2-ciudad-uy{grid-area:b}
  .v2-linea{grid-area:l}
}
@media (prefers-reduced-motion: reduce){
  .v2-l > span{animation:none}
  .v2-linea{animation:entrar .3s ease backwards}
  .v3-detalle.entra{animation:entrar .2s ease}
  .v3-chip:active > span{transform:none}
}


/* ===== The Picker (spec verbatim: PICKER.md) ===== */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}

.proto-picker[data-position="top"]{bottom:auto;top:24px}

<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Ruta</button>
  <button class="proto-picker-item">Manifiesto</button>
  <button class="proto-picker-item">Mercado</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>

const TOP = "<header class=\"top\">\n  <div class=\"wrap bar\">\n    <a class=\"marca\" href=\"../../index.html#inicio\" aria-label=\"SGV Importaciones, ir al inicio\"><img class=\"logo\" src=\"../../assets/logo-claro.webp\" width=\"360\" height=\"294\" alt=\"SGV Importaciones\"></a>\n    <nav class=\"nav\" aria-label=\"Secciones\">\n      <a href=\"../../index.html#historia\">Historia</a>\n      <a href=\"../../index.html#resenas\">Reseñas</a>\n      <a class=\"nav-cta\" href=\"../../index.html#contacto\">Contacto</a>\n    </nav>\n  </div>\n</header>", V1 = "  <div class=\"hero\">\n    <section class=\"wrap hero-grid\" aria-labelledby=\"titulo-portada\">\n      <div>\n        <h1 id=\"titulo-portada\">Importamos productos y los vendemos en Chile y Uruguay.</h1>\n        <p class=\"intro\">SGV Importaciones es una sociedad con base en los dos países. Elegimos los productos, gestionamos su importación y los vendemos en ambos mercados.</p>\n        <div class=\"acciones\">\n          <a class=\"btn btn-oro\" href=\"../../index.html#contacto\">Escríbenos</a>\n          <a class=\"btn btn-claro\" href=\"../../index.html#historia\">Conoce nuestra historia</a>\n        </div>\n      </div>\n\n      <div class=\"globo-bloque\">\n        <div class=\"globo\">\n          <img src=\"../../assets/globe.svg\" width=\"600\" height=\"600\" alt=\"\" decoding=\"async\">\n          <svg class=\"ruta\" viewBox=\"0 0 600 600\" fill=\"none\" role=\"img\" aria-label=\"Ruta comercial entre Santiago de Chile y Montevideo, Uruguay\">\n            <defs>\n              <linearGradient id=\"arco-g\" gradientUnits=\"userSpaceOnUse\" x1=\"270.2\" y1=\"312.5\" x2=\"326.2\" y2=\"319\">\n                <stop offset=\"0\" stop-color=\"#5E86FF\"/><stop offset=\".5\" stop-color=\"#FF6050\"/><stop offset=\"1\" stop-color=\"#FCD116\"/>\n              </linearGradient>\n            </defs>\n            <path class=\"arco\" d=\"M270.2 312.5Q298.2 205 326.2 319\" stroke=\"url(#arco-g)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n            <g class=\"nodo nodo-cl\">\n              <circle class=\"ping\" cx=\"270.2\" cy=\"312.5\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n              <circle cx=\"270.2\" cy=\"312.5\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n              <circle cx=\"270.2\" cy=\"312.5\" r=\"4.2\" fill=\"#fff\"/>\n            </g>\n            <g class=\"nodo nodo-uy\">\n              <circle class=\"ping\" cx=\"326.2\" cy=\"319\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n              <circle cx=\"326.2\" cy=\"319\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n              <circle cx=\"326.2\" cy=\"319\" r=\"4.2\" fill=\"#fff\"/>\n            </g>\n          </svg>\n        </div>\n        <dl class=\"coords\">\n          <div><dt><span class=\"punto punto-cl\" aria-hidden=\"true\"></span>Santiago, Chile</dt><dd>33°27′ S, 70°40′ O</dd></div>\n          <div><dt><span class=\"punto punto-uy\" aria-hidden=\"true\"></span>Montevideo, Uruguay</dt><dd>34°54′ S, 56°10′ O</dd></div>\n        </dl>\n      </div>\n    </section>\n  </div>\n\n", V2 = "  <div class=\"hero v2\">\n    <section class=\"wrap v2-grid\" aria-labelledby=\"titulo-portada\">\n      <h1 id=\"titulo-portada\" class=\"v2-h1\"><span class=\"v2-l\"><span style=\"--i:0\">Importamos productos</span></span><span class=\"v2-l\"><span style=\"--i:1\">y los vendemos en</span></span><span class=\"v2-l\"><span style=\"--i:2\">Chile y Uruguay.</span></span></h1>\n      <div class=\"v2-riel\" role=\"img\" aria-label=\"Ruta entre Santiago de Chile y Montevideo, Uruguay\">\n        <div class=\"v2-ciudad\"><b>Santiago, Chile</b><small>33°27′ S, 70°40′ O</small></div>\n        <span class=\"v2-linea\"></span>\n        <div class=\"v2-ciudad v2-ciudad-uy\"><b>Montevideo, Uruguay</b><small>34°54′ S, 56°10′ O</small></div>\n      </div>\n      <div class=\"v2-pie\">\n        <p class=\"intro\">SGV Importaciones es una sociedad con base en los dos países. Elegimos los productos, gestionamos su importación y los vendemos en ambos mercados.</p>\n        <div class=\"acciones\">\n          <a class=\"btn btn-oro\" href=\"../../index.html#contacto\">Escríbenos</a>\n          <a class=\"btn btn-claro\" href=\"../../index.html#historia\">Conoce nuestra historia</a>\n        </div>\n      </div>\n    </section>\n  </div>\n", V3 = "  <div class=\"hero v3\">\n    <section class=\"wrap v3-grid\" aria-labelledby=\"titulo-portada\">\n      <h1 id=\"titulo-portada\" class=\"v3-h1\">Importamos productos y los vendemos en Chile y Uruguay.</h1>\n      <p class=\"intro v3-intro\">SGV Importaciones es una sociedad con base en los dos países. Elegimos los productos, gestionamos su importación y los vendemos en ambos mercados.</p>\n      <fieldset class=\"v3-mercado\">\n        <legend class=\"v3-pregunta\">¿Desde dónde nos escribes?</legend>\n        <div class=\"v3-consola\" data-market=\"cl\">\n          <label class=\"v3-chip v3-chip-cl\"><input type=\"radio\" name=\"mercado\" value=\"cl\" checked><span><b>Chile</b><small>Pesos chilenos</small></span></label>\n          <div class=\"v3-globo\"><img src=\"../../assets/globe.svg\" width=\"600\" height=\"600\" alt=\"\" decoding=\"async\"><svg class=\"ruta\" viewBox=\"0 0 600 600\" fill=\"none\" role=\"img\" aria-label=\"Ruta comercial entre Santiago de Chile y Montevideo, Uruguay\">\n  <defs><linearGradient id=\"arco-g3\" gradientUnits=\"userSpaceOnUse\" x1=\"270.2\" y1=\"312.5\" x2=\"326.2\" y2=\"319\"><stop offset=\"0\" stop-color=\"#5E86FF\"/><stop offset=\".5\" stop-color=\"#FF6050\"/><stop offset=\"1\" stop-color=\"#FCD116\"/></linearGradient></defs>\n  <path class=\"arco\" d=\"M270.2 312.5Q298.2 205 326.2 319\" stroke=\"url(#arco-g3)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n  <g class=\"nodo nodo-cl\"><circle class=\"ping\" cx=\"270.2\" cy=\"312.5\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/><circle cx=\"270.2\" cy=\"312.5\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/><circle cx=\"270.2\" cy=\"312.5\" r=\"4.2\" fill=\"#fff\"/></g>\n  <g class=\"nodo nodo-uy\"><circle class=\"ping\" cx=\"326.2\" cy=\"319\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/><circle cx=\"326.2\" cy=\"319\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.5\"/><circle cx=\"326.2\" cy=\"319\" r=\"4.2\" fill=\"#fff\"/></g>\n</svg></div>\n          <label class=\"v3-chip v3-chip-uy\"><input type=\"radio\" name=\"mercado\" value=\"uy\"><span><b>Uruguay</b><small>Pesos uruguayos</small></span></label>\n        </div>\n      </fieldset>\n      <div class=\"v3-detalle\" aria-live=\"polite\">\n        <p class=\"v3-texto\">__TEXTO__</p>\n        <ul class=\"v3-monedas\">__MONEDAS__</ul>\n        <a class=\"btn btn-oro v3-cta\" href=\"../../index.html#contacto\">__CTA__</a>\n      </div>\n    </section>\n  </div>\n", DATOS = "  <section class=\"wrap datos\" aria-label=\"Datos de la empresa\">\n    <dl>\n      <div><dt>Empresa</dt><dd>SGV Importaciones</dd></div>\n      <div><dt>Bases</dt><dd>Chile y Uruguay</dd></div>\n      <div><dt>Actividad</dt><dd>Importación y venta de productos</dd></div>\n      <div><dt>Monedas</dt><dd>CLP, UYU y USD</dd></div>\n      <div><dt>Contacto</dt><dd><a href=\"../../index.html#contacto\">Formulario de contacto</a></dd></div>\n    </dl>\n  </section>";
const MERCADOS = {
  cl: { texto: 'Atendemos a clientes de Chile en pesos chilenos (CLP) o en dólares (USD).', monedas: ['CLP', 'USD'], cta: 'Escríbenos desde Chile' },
  uy: { texto: 'Atendemos a clientes de Uruguay en pesos uruguayos (UYU) o en dólares (USD).', monedas: ['UYU', 'USD'], cta: 'Escríbenos desde Uruguay' }
};
const monedasHtml = m => m.monedas.map(c => '<li>' + c + '</li>').join('');
const v3 = () => V3.replace('__TEXTO__', MERCADOS.cl.texto).replace('__MONEDAS__', monedasHtml(MERCADOS.cl)).replace('__CTA__', MERCADOS.cl.cta);
// `variants`: una función de render por variante, en el orden del selector.
const frame = (hero) => TOP + '<main id="inicio" tabindex="-1">' + hero + DATOS + '</main>';
const variants = [() => frame(V1), () => frame(V2), () => frame(v3())];

// Interacción de la variante 3 (delegada: el escenario se vuelve a montar al cambiar de variante)
document.addEventListener('change', (e) => {
  if (!e.target.matches('.v3-consola input[name="mercado"]')) return;
  const consola = e.target.closest('.v3-consola'), m = MERCADOS[e.target.value], detalle = document.querySelector('.v3-detalle');
  consola.dataset.market = e.target.value;
  detalle.querySelector('.v3-texto').textContent = m.texto;
  detalle.querySelector('.v3-monedas').innerHTML = monedasHtml(m);
  detalle.querySelector('.v3-cta').textContent = m.cta;
  detalle.classList.remove('entra'); void detalle.offsetWidth; detalle.classList.add('entra');
  const ping = consola.querySelector(e.target.value === 'cl' ? '.nodo-cl .ping' : '.nodo-uy .ping');
  ping.classList.remove('pulsa'); ping.style.animation = 'none'; void ping.getBoundingClientRect(); ping.style.animation = ''; ping.classList.add('pulsa');
});

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script>
</body>
